name: Update official apartment trades
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8,20 * * *'
  push:
    branches: [main]
    paths: [index.html, scripts/update-property.py, .github/workflows/property-market.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare public trade feed
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          MOLIT_LAWD_CD: ${{ secrets.MOLIT_LAWD_CD }}
        run: python3 scripts/update-property.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _property_site
      - name: Publish updated site and trades
        id: deployment
        uses: actions/deploy-pages@v4
