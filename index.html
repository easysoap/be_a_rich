function dashboard(){const c=calc(),budget=state.settings.budget,left=budget-c.living,pct=budget?c.living/budget*100:0,days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate(),remaining=month===today().slice(0,7)?Math.max(1,days-Number(today().slice(8))+1):days,prev=state.history.find(h=>h.month===previousMonth(month)),change=person==='전체'&&prev?c.net-prev.net:null,due=dueItems(),uncat=c.tx.filter(t=>t.category==='미분류').length,plans=state.plans.filter(p=>person==='전체'||p.account.startsWith(person)),target=plans.reduce((s,p)=>s+p.target,0),planDone=plans.reduce((s,p)=>s+p.records.filter(r=>r.date.startsWith(month)).reduce((a,r)=>a+r.amount,0),0),assetDate=state.assets.filter(matches).map(a=>a.date).sort()[0];return`${heading('함께 모으는 오늘, 우리 집 한눈에','소비부터 자산까지, 우리 둘의 돈 흐름을 살펴보세요.')}${demoBanner()}

<section class="card budget-card">${cardTop('이번 달 남은 생활비','예산 설정','settings')}<div class="budget-head"><div class="amount ${left<0?'negative':''}">${num(left)}<em>원</em></div><span class="budget-label">예산 ${num(budget/10000)}만 원</span></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,pct))}%;${left<0?'background:#cc8380':''}"></i></div><div class="budget-used"><span>${won(c.living)} 사용</span><strong>${pct.toFixed(0)}% 사용</strong></div><div class="daily-budget">${icon('calendar')}${left>=0?`남은 ${remaining}일, 하루 ${won(left/remaining)} 정도 쓸 수 있어요.`:'이번 달 예산을 초과했어요. 지출을 확인해 보세요.'}</div><div class="budget-mini"><div><small><i></i>이번 달 수입</small><strong>${man(c.income)} 원</strong></div><div><small><i></i>주식 모으기</small><strong>${man(planDone)} 원</strong></div><div><small><i></i>수입 대비 소비</small><strong>${c.income?(c.expense/c.income*100).toFixed(1):'0'}%</strong></div></div></section></div>
<div class="mid-grid"><section class="card">${cardTop('차곡차곡, 순자산 추이','월말 기록','snapshot')}<div class="chart-summary">${man(c.net)} 원 ${change!==null?`<small>전월 대비 ${prev.net?((c.net-prev.net)/Math.abs(prev.net)*100).toFixed(1):0}%</small>`:''}</div>${lineChart(c)}<div class="chart-caption">직접 입력한 자산 평가액 기준</div></section>
<section class="card">${cardTop('이번 달 예상 상환','전체 보기','go-loans')}<div class="metric-value">${num(c.interest+c.principal)}<small>원</small></div><p class="metric-sub">남은 빚 ${man(c.debt)} 원</p><div class="loan-breakdown"><div class="line-pair"><span>원금 상환</span><strong>${won(c.principal)}</strong></div><div class="line-pair"><span>이자 비용</span><strong>${won(c.interest)}</strong></div></div><div class="loan-foot">${icon('info')}잔액·금리로 계산한 예상 납부액</div></section>
<section class="card investment-card">${cardTop('우리의 투자','전체 보기','go-invest')}<div class="metric-value">${num(c.stock)}<small>원</small></div><p class="metric-sub">투자 원금 ${man(c.cost)} 원</p><div class="investment-profit"><strong class="${c.profit>=0?'positive':'negative'}">${c.profit>=0?'+':''}${won(c.profit)}</strong><span class="profit-chip">${c.rate>=0?'+':''}${c.rate.toFixed(2)}%</span></div><div class="invest-plan"><div class="invest-plan-head"><span>주식 모으기 진행률</span><strong>${target?Math.round(planDone/target*100):0}%</strong></div><div class="progress"><i style="width:${target?Math.min(100,planDone/target*100):0}%"></i></div><div class="invest-plan-foot"><span>${man(planDone)} 원</span><span>목표 ${man(target)} 원</span></div></div></section></div>
<div class="bottom-grid"><section class="card">${cardTop('우리 집 자산은 이렇게','관리하기','go-assets')}${allocation(c)}<div class="allocation-note">부동산·보증금은 직접 입력한 평가액이에요.</div></section>
<section class="card">${cardTop('다가오는 납부','관리하기','bills')}<div class="schedule-head"><span>${Number(month.slice(5))}월 남은 납부 일정</span><strong>${won(due.reduce((s,x)=>s+x.amount,0))}</strong></div>${due.slice(0,3).map(x=>`<div class="schedule-item"><span class="date-box">${x.day}일</span><div class="item-copy"><strong>${esc(x.name)}</strong><small>${esc(x.detail)}</small></div><strong>${won(x.amount)}</strong></div>`).join('')||'<div class="empty">남은 납부 일정이 없어요.</div>'}<p class="schedule-note">카드 출금은 소비에 다시 더하지 않아요.${due.length>3?` 외 ${due.length-3}건은 관리하기에서 확인` :''}</p></section>
<section class="card">${cardTop('잠깐, 확인해 주세요','','',uncat?`<span class="check-badge">${uncat}</span>`:'')}<button class="check-item" data-action="review"><span class="check-icon">${icon('file')}</span><span class="check-copy"><strong>${uncat?`분류를 기다리는 내역 ${uncat}건`:'모든 지출이 분류되었어요'}</strong><small>한 번 확인하면 다음에는 더 간편하게</small></span>${icon('right')}</button><button class="check-item" data-action="go-assets"><span class="check-icon">${icon('home')}</span><span class="check-copy"><strong>우리 집 자산 평가액</strong><small>${assetDate?`입력 기준일 ${esc(assetDate)}`:'아직 등록된 자산이 없어요'}</small></span>${icon('right')}</button><button class="check-item" data-action="go-invest"><span class="check-icon">${icon('chart')}</span><span class="check-copy"><strong>투자 종목 가격 확인</strong><small>직접 입력한 가격 · 실시간 미연동</small></span>${icon('right')}</button><p class="quote">오늘도 우리만의 속도로, 차근차근 모아요.</p></section></div><p class="context-note">자산·대출·종목 가격은 최신 입력값 기준이며, 생활비·모으기 기록은 선택한 월 기준이에요. 개인별 보기는 명의 기준이며 공동 자산은 ‘공동’에서 확인할 수 있어요.</p>`;}
function previousMonth(m){const [y,n]=m.split('-').map(Number);return`${n===1?y-1:y}-${String(n===1?12:n-1).padStart(2,'0')}`;}
function summary(items){return`<div class="summary-strip">${items.map(([label,value,note])=>`<div class="card"><small>${label}</small><strong>${value}</strong><p>${note}</p></div>`).join('')}</div>`;}
function ledger(){const c=calc(),tx=c.tx.filter(t=>(ledgerFilter==='전체'||ledgerFilter==='미분류'&&t.category==='미분류'||ledgerFilter==='수입'&&t.kind==='income'||ledgerFilter==='지출'&&t.kind==='expense')&&(!search||(t.merchant+' '+t.category).toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));return`${heading('함께 쓰는 가계부','네 장의 카드도, 두 사람의 소비도 한곳에서.')}${demoBanner()}<div class="card-accounts">${state.cards.map(card=>`<div class="mini-bank-card">${icon('card')}<div><strong>${esc(card.name)}</strong><small>${esc(card.person)} · 매월 ${card.day}일 결제</small></div><button data-action="card-edit" data-id="${card.id}" aria-label="${esc(card.name)} 수정">수정</button></div>`).join('')}<button class="mini-bank-card" data-action="card-new">${icon('plus')}<strong>카드 추가</strong></button></div>${summary([['이번 달 수입',won(c.income),'수입으로 기록한 내역의 합계'],['이번 달 지출',won(c.expense),'취소는 차감 · 이체는 제외'],['남은 생활비',won(state.settings.budget-c.living),`월 예산 ${won(state.settings.budget)}`]])}<div class="section-toolbar"><div class="filter-tabs">${['전체','지출','수입','미분류'].map(v=>`<button class="${v===ledgerFilter?'selected':''}" data-action="ledger-filter" data-value="${v}">${v}</button>`).join('')}</div><input type="search" class="search-input" id="tx-search" placeholder="가맹점·분류 검색" aria-label="가맹점 또는 분류 검색" value="${esc(search)}"><button class="button secondary" data-action="tx-new">${icon('plus')}직접 기록</button></div><section class="card table-card">${cardTop('우리의 소비 기록',`${tx.length}건`,'noop')}<div class="table-container"><table><thead><tr><th>날짜</th><th>사용 내역</th><th>분류</th><th>카드</th><th>사용자</th><th class="num">금액</th><th></th></tr></thead><tbody>${tx.map(t=>`<tr><td class="muted">${esc(t.date.slice(5).replace('-','.'))}</td><td>${esc(t.merchant)}</td><td><span class="category-tag" data-cat="${esc(t.category)}">${esc(t.category)}</span></td><td><span class="card-tag">${esc(state.cards.find(c=>c.id===t.card)?.name||'직접 입력')}</span></td><td><span class="person-tag">${esc(t.person)}</span></td><td class="num ${t.kind==='income'?'positive':''}">${t.kind==='income'?'+':''}${won(t.amount)}</td><td><button class="row-action" data-action="tx-edit" data-id="${t.id}">수정</button></td></tr>`).join('')}</tbody></table>${!tx.length?'<div class="empty">아직 내역이 없어요.<br>카드 내역을 가져오거나 직접 기록해 보세요.</div>':''}</div><p class="table-foot">카드 대금 출금·계좌 이체·대출 원금 상환은 지출 합계에서 제외합니다. 카드 내역은 저장 전 미리보기에서 확인할 수 있어요.</p></section>`;}
function assets(){const c=calc();return`${heading('자산 모아보기','집부터 비상금까지, 우리가 가진 것들을 차곡차곡.','asset-new')}${demoBanner()}${summary([['우리 집 총자산',won(c.assets),'등록한 자산 + 투자 평가금액'],['남은 빚',won(c.debt),'현재 대출 잔액의 합계'],['우리 집 순자산',won(c.net),'총자산에서 총부채를 뺀 금액']])}<div class="info-note">${icon('info')}평가액은 직접 입력해요. 증권 보유 금액은 투자 화면에서 자동 합산되므로 별도 자산으로 중복 등록하지 마세요.</div><div class="asset-grid">${state.assets.filter(matches).map(a=>`<section class="card asset-card"><span class="asset-symbol">${icon(a.type==='부동산'?'building':a.type==='보증금'?'home':'wallet')}</span><div class="asset-content"><h3>${esc(a.name)}</h3><p>${esc(a.type)} · ${esc(a.person)}</p><div class="asset-value">${won(a.value)}</div><div class="asset-meta">평가 기준일 ${esc(a.date)}</div></div><button class="icon-button" data-action="asset-edit" data-id="${a.id}" aria-label="${esc(a.name)} 수정">${icon('edit')}</button></section>`).join('')||'<div class="card empty">자산을 추가해 우리 집의 순자산을 확인해 보세요.</div>'}<section class="card asset-card"><span class="asset-symbol">${icon('chart')}</span><div class="asset-content"><h3>투자 평가금액</h3><p>보유 종목에서 자동 합산</p><div class="asset-value">${won(c.stock)}</div><div class="asset-meta">직접 입력한 종목 가격 기준</div></div><button class="icon-button" data-action="go-invest" aria-label="투자 관리">${icon('right')}</button></section></div><div class="section-toolbar" style="margin-top:24px"><p class="modal-note">현재 금액을 월말 기록으로 남기면 순자산 추이 그래프에 반영됩니다.</p><button class="button secondary" data-action="snapshot">${icon('calendar')}이번 달 기록 남기기</button></div>`;}
function investments(){const c=calc(),stocks=state.stocks.filter(matches),plans=state.plans.filter(p=>person==='전체'||p.account.startsWith(person));return`${heading('투자와 주식 모으기','작은 매수를 쌓아, 우리의 미래를 키워요.','stock-new')}${demoBanner()}${summary([['투자 평가금액',won(c.stock),'수량 × 직접 입력한 가격'],['총 매입 원금',won(c.cost),'수량 × 평균 매입가'],['보유 종목 평가손익',`${c.profit>=0?'+':''}${won(c.profit)}`,`평가수익률 ${c.rate.toFixed(2)}% · 세금·수수료·배당 미반영`]])}<div class="info-note">${icon('info')}현재 버전은 시세 API에 연결되지 않았어요. 각 종목의 가격을 직접 수정하면 평가금액·수익률에 바로 반영돼요. 모든 금액은 원화 기준입니다.</div><section class="card table-card">${cardTop('보유 종목','','')}<div class="table-container"><table class="invest-table"><thead><tr><th>종목 / 계좌</th><th class="num">보유 수량</th><th class="num">평균 매입가</th><th class="num">입력한 가격</th><th class="num">평가금액</th><th class="num">평가손익</th><th></th></tr></thead><tbody>${stocks.map(s=>{const profit=s.qty*(s.price-s.cost);return`<tr><td><span class="stock-name">${esc(s.name)}</span><small class="stock-code">${esc(s.account)} · ${esc(s.code)}</small></td><td class="num">${s.qty.toLocaleString('ko-KR',{maximumFractionDigits:6})}주</td><td class="num">${won(s.cost)}</td><td class="num">${won(s.price)}<small class="stock-code">${esc(s.date)}</small></td><td class="num">${won(s.qty*s.price)}</td><td class="num ${profit>=0?'positive':'negative'}">${profit>=0?'+':''}${won(profit)}<small class="stock-code">${s.cost?((s.price-s.cost)/s.cost*100).toFixed(2):'0.00'}%</small></td><td><button class="row-action" data-action="stock-edit" data-id="${s.id}">수정</button></td></tr>`;}).join('')}</tbody></table>${!stocks.length?'<div class="empty">첫 번째 보유 종목을 등록해 주세요.</div>':''}</div></section><div class="section-toolbar" style="margin-top:28px;margin-bottom:0"><h2 class="section-heading" style="margin:0">매달, 주식 모으기</h2><button class="button secondary" data-action="plan-new">${icon('plus')}모으기 목표 추가</button></div><div class="plan-grid">${plans.map(p=>{const done=p.records.filter(r=>r.date.startsWith(month)).reduce((s,r)=>s+r.amount,0);return`<section class="card plan-card">${cardTop(esc(p.name),'목표 수정','plan-edit:'+p.id)}<p class="metric-sub">${esc(p.account)}</p><div class="line-pair"><span>이번 달 실제 적립 기록</span><strong>${won(done)}</strong></div><div class="progress"><i style="width:${p.target?Math.min(100,done/p.target*100):0}%"></i></div><div class="line-pair"><span>월 목표 ${won(p.target)}</span><strong>${p.target?Math.round(done/p.target*100):0}%</strong></div><button class="button ghost" style="margin-top:15px" data-action="plan-record" data-id="${p.id}">${icon('plus')}매수 기록하기</button><p class="plan-caption">적립 진행률 기록용 · 보유 수량은 위 종목에서 별도로 수정해요.</p>${p.records.filter(r=>r.date.startsWith(month)).map((r)=>`<div class="line-pair"><span>${esc(r.date)}</span><strong>${won(r.amount)} <button class="row-action" data-action="plan-record-delete" data-id="${p.id}" data-date="${esc(r.date)}" data-record="${p.records.indexOf(r)}" aria-label="${esc(r.date)} 매수 기록 삭제">×</button></strong></div>`).join('')}</section>`;}).join('')||'<div class="card empty">매달 모으고 싶은 목표를 정해 보세요.</div>'}</div>`;}
function loans(){const c=calc();return`${heading('대출과 상환','남은 빚은 또렷하게, 줄어드는 과정은 차근차근.','loan-new')}${demoBanner()}${summary([['현재 남은 빚',won(c.debt),'등록한 대출의 현재 잔액 합계'],['이번 달 예상 이자',won(c.interest),'현재 잔액 × 연이율 ÷ 12'],['이번 달 예상 상환액',won(c.interest+c.principal),'대출 원금 + 예상 이자']])}<div class="info-note">${icon('info')}대출 잔액은 상환 후 직접 갱신해 주세요. 이자는 예상치로, 일수·금리 변경·금융기관 계산 방식에 따라 실제 청구액과 다를 수 있어요. 실제 납부 이자는 가계부에 기록할 수 있어요.</div><div class="asset-grid">${state.loans.filter(matches).map(l=>{const p=payment(l);return`<section class="card loan-detail"><div class="loan-header"><span class="asset-symbol">${icon('landmark')}</span><div><h3>${esc(l.name)}</h3><p>${esc(l.person)} · ${esc(l.method)}상환</p></div><button class="icon-button" style="margin-left:auto" data-action="loan-edit" data-id="${l.id}" aria-label="${esc(l.name)} 수정">${icon('edit')}</button></div><div class="loan-value">${won(l.balance)}</div><p>잔액 기준일 ${esc(l.date)}</p><div class="loan-details"><div><small>연이율</small><strong>${l.rate}%</strong></div><div><small>납부일</small><strong>매월 ${l.day}일</strong></div><div><small>남은 기간</small><strong>${l.months}개월</strong></div></div><div class="payment-split"><span>이번 달 예상 원금·이자</span><strong>${won(p.principal+p.interest)}</strong></div><div class="line-pair"><span>원금 상환</span><strong>${won(p.principal)}</strong></div><div class="line-pair"><span>이자 비용</span><strong>${won(p.interest)}</strong></div><p class="loan-estimate">${l.method==='만기일시'?'매월 이자를 내고, 만기에 원금을 상환하는 방식이에요.':'현재 잔액과 남은 개월 수로 다음 납부액을 추정해요.'}</p></section>`;}).join('')||'<div class="card empty">대출을 등록하면 잔액과 예상 이자를 함께 볼 수 있어요.</div>'}</div>`;}
function render(){const titles={dashboard:'우리 집 한눈에',ledger:'함께 쓰는 가계부',assets:'자산 모아보기',invest:'투자와 주식 모으기',loans:'대출과 상환'};document.getElementById('main').innerHTML=({dashboard,ledger,assets,invest:investments,loans}[page])();document.getElementById('breadcrumb').textContent=titles[page];document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('.nav-count').textContent=state.cards.length;hydrateIcons();}

function guessCategory(merchant){const saved=state.rules.find(r=>merchant.toLowerCase().includes(r.merchant.toLowerCase()));if(saved)return saved.category;const dict=[['카페·간식',/스타벅스|투썸|커피|카페|빽다방|메가커피/],['식비',/마트|식당|배달|음식|김밥|치킨|버거|식품|이마트|홈플러스|정식|편의점/],['생활용품',/다이소|무인양품|생활/],['교통',/주유|칼텍스|교통|지하철|택시|버스|철도|하이패스|주차/],['주거·통신',/관리비|통신|텔레콤|전기|가스|수도|인터넷/],['건강',/병원|약국|의원|치과/],['문화·여가',/서점|영화|CGV|메가박스|알라딘|교보/],['쇼핑',/유니클로|올리브영|백화점|의류/],['여행',/호텔|항공|숙박|에어비앤비/]];return dict.find(([,r])=>r.test(merchant))?.[0]||'미분류';}

function csvLines(text){const rows=[];let row=[],cell='',quote=false;const delim=text.includes('\t')?'\t':',';text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(c===delim&&!quote){row.push(cell.trim());cell='';}else if((c==='\n'||c==='\r')&&!quote){row.push(cell.trim());if(row.some(x=>x))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell.trim());if(row.some(x=>x))rows.push(row);return rows;}
function parseDate(s){const raw=s.trim();let m=raw.match(/^(\d{4})[./\-년]\s*(\d{1,2})[./\-월]\s*(\d{1,2})/);if(!m&&/^\d{8}$/.test(raw))m=[raw,raw.slice(0,4),raw.slice(4,6),raw.slice(6,8)];if(!m){const short=raw.match(/^(\d{1,2})[./\-월]\s*(\d{1,2})/);if(short)m=[raw,month.slice(0,4),short[1],short[2]];}if(!m)return null;const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);if(mo<1||mo>12||d<1||d>new Date(y,mo,0).getDate())return null;return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function parseAmount(s){if(!s||!/\d/.test(s))return null;let cleaned=s.replace(/[,₩원\s]/g,'');if(/^\(.*\)$/.test(cleaned))cleaned='-'+cleaned.slice(1,-1);const n=Number(cleaned);return Number.isFinite(n)&&Math.abs(n)<1e14?Math.round(n):null;}

function validBackup(d){const finite=(v)=>typeof v==='number'&&Number.isFinite(v),text=(v)=>typeof v==='string';if(!d||d.version!==1||!d.settings||!finite(d.settings.budget)||d.settings.budget<0)return false;for(const key of ['assets','loans','stocks','cards','transactions','plans','history','rules'])if(!Array.isArray(d[key]))return false;const base=x=>x&&text(x.id)&&/^[a-zA-Z0-9-]+$/.test(x.id)&&text(x.name)&&text(x.person);return d.assets.every(a=>base(a)&&finite(a.value)&&a.value>=0&&text(a.type)&&!!parseDate(a.date||''))&&d.loans.every(l=>base(l)&&finite(l.balance)&&l.balance>=0&&finite(l.rate)&&l.rate>=0&&l.rate<=100&&Number.isInteger(l.months)&&l.months>=1&&['만기일시','원금균등','원리금균등'].includes(l.method)&&Number.isInteger(l.day)&&l.day>=1&&l.day<=31&&!!parseDate(l.date||''))&&d.stocks.every(s=>base(s)&&text(s.account)&&text(s.code)&&['qty','cost','price'].every(k=>finite(s[k])&&s[k]>=0)&&!!parseDate(s.date||''))&&d.cards.every(c=>base(c)&&finite(c.bill)&&c.bill>=0&&Number.isInteger(c.day)&&c.day>=1&&c.day<=31)&&d.transactions.every(t=>t&&text(t.id)&&text(t.merchant)&&text(t.person)&&text(t.card)&&finite(t.amount)&&!!parseDate(t.date||'')&&text(t.category)&&['income','expense','transfer'].includes(t.kind))&&d.plans.every(p=>p&&text(p.id)&&text(p.name)&&text(p.account)&&finite(p.target)&&p.target>0&&Array.isArray(p.records)&&p.records.every(r=>finite(r.amount)&&r.amount>0&&!!parseDate(r.date||'')))&&d.history.every(h=>h&&text(h.month)&&/^\d{4}-\d{2}$/.test(h.month)&&finite(h.net))&&d.rules.every(r=>r&&text(r.merchant)&&text(r.category));}

function addMonth(m,n=1){const [y,mo]=m.split('-').map(Number),d=new Date(Date.UTC(y,mo-1+n,1));return d.toISOString().slice(0,7);}
function monthDistance(a,b){return(Number(b.slice(0,4))-Number(a.slice(0,4)))*12+Number(b.slice(5))-Number(a.slice(5));}
function dayInMonth(m,day){return`${m}-${String(Math.min(day,new Date(Number(m.slice(0,4)),Number(m.slice(5)),0).getDate())).padStart(2,'0')}`;}

function firstBillMonth(t,card){if(t.firstBill&&/^\d{4}-\d{2}$/.test(t.firstBill))return t.firstBill;let cycle=t.date.slice(0,7);if(Number(t.date.slice(8))>Math.min(card.cycleEnd||31,new Date(Number(cycle.slice(0,4)),Number(cycle.slice(5)),0).getDate()))cycle=addMonth(cycle);let first=addMonth(cycle,Number(card.paymentLag??1));if(dayInMonth(first,card.day)<t.date)first=addMonth(first);return first;}
function installmentPart(amount,n,i){if(i<0||i>=n)return 0;const sign=amount<0?-1:1,a=Math.abs(Math.round(amount)),base=Math.floor(a/n);return sign*(base+(i<a%n?1:0));}
function billRows(card,m,d=state){return d.transactions.filter(t=>t.card===card.id&&t.kind==='expense').map(t=>{const n=t.amount<0?1:Math.max(1,Number(t.installments)||1),first=firstBillMonth(t,card),i=monthDistance(first,m);return{transaction:t,first,index:i+1,count:n,amount:installmentPart(t.amount,n,i)};}).filter(r=>r.amount!==0);}

function fixedFor(m,d=state){return d.fixedExpenses.filter(f=>f.active&&m>=f.start&&(!f.end||m<=f.end)).map(f=>({...f,date:dayInMonth(m,f.day),transaction:d.transactions.find(t=>t.fixedId===f.id&&t.date.startsWith(m))}));}

function portfolio(d=state,until='9999-12-31'){
 const results=d.stocks.map(s=>{let qty=Number(s.openingQty??s.qty),cost=qty*Number(s.openingCost??s.cost),realized=0,dividends=0;const history=[];const trades=d.investmentTrades.filter(t=>t.stockId===s.id&&t.date<=until).sort((a,b)=>a.date.localeCompare(b.date)||(a.seq||0)-(b.seq||0));

}
function fundTotals(m,d=state){const rows=d.fundFlows.filter(f=>f.date.startsWith(m)),year=d.fundFlows.filter(f=>f.date.startsWith(m.slice(0,4)));const signed=r=>r.direction==='입금'?r.amount:-r.amount;return{rows,net:rows.reduce((s,r)=>s+signed(r),0),savings:rows.filter(r=>r.includeSavings).reduce((s,r)=>s+signed(r),0),year,yearNet:year.reduce((s,r)=>s+signed(r),0),yearDeposits:year.filter(r=>r.direction==='입금').reduce((s,r)=>s+r.amount,0)};}

function snapshotData(m,d=state){const pf=portfolio(d),assets=d.assets.reduce((s,a)=>s+a.value,0),debt=d.loans.reduce((s,l)=>s+l.balance,0);return{month:m,net:assets+pf.value-debt,assets:assets+pf.value,debt,investProfit:pf.unrealized+pf.realized,property:d.assets.filter(a=>a.type==='부동산').reduce((s,a)=>s+a.value,0),savedAt:new Date().toISOString(),report:monthReport(m,d)};}
function netAttribution(m,d=state){const prev=d.history.find(h=>h.month===addMonth(m,-1)),current=d.history.find(h=>h.month===m&&h.debt!==undefined)||snapshotData(m,d);if(!prev||prev.debt===undefined||prev.investProfit===undefined)return null;const change=current.net-prev.net,debt=prev.debt-current.debt,invest=current.investProfit-prev.investProfit,valuation=d.valuationEvents.filter(e=>e.date.startsWith(m)&&e.reason==='평가액 변경'&&e.type==='부동산').reduce((s,e)=>s+e.after-e.before,0);return{change,debt,invest,valuation,other:change-debt-invest-valuation,current,previous:prev};}
function forecast(d=state,date=today()){const m=date.slice(0,7);let end=dayInMonth(m,d.settings.payday||25);if(end<=date)end=dayInMonth(addMonth(m),d.settings.payday||25);const items=[];for(const mo of[m,addMonth(m)]){
 for(const c of d.cards){const when=dayInMonth(mo,c.day);if(when>=date&&when<end){const b=cardBill(c,mo,d);if(b.amount)items.push({date:when,name:c.name,detail:b.manual?'입력한 청구액':'예상 카드 청구액',amount:b.amount});}}

function safeExtraData(d){const n=x=>typeof x==='number'&&Number.isFinite(x),str=x=>typeof x==='string',id=x=>str(x)&&/^[a-zA-Z0-9-]+$/.test(x),date=x=>str(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!!parseDate(x),mon=x=>str(x)&&/^\d{4}-(0[1-9]|1[0-2])$/.test(x);if(d.version!==2)return false;for(const k of extraArrays)if(!Array.isArray(d[k]))return false;if(!n(d.settings.payday)||d.settings.payday<1||d.settings.payday>31||!d.settings.categoryBudgets||Object.entries(d.settings.categoryBudgets).some(([k,v])=>!CAT.includes(k)||!n(v)||v<0))return false;

function paymentsPage(){const bills=state.cards.filter(matches).map(c=>({c,b:cardBill(c,month)})),inst=installmentList().filter(r=>matches(r.t)),total=bills.reduce((s,x)=>s+x.b.amount,0);return`${pageHead('카드 청구와 남은 할부','결제일에 빠져나갈 돈, 아직 남아 있는 약속까지.','카드 추가','card-new')}${demoBanner()}${summary([['선택 월 청구 예정',won(total),'입력한 청구액이 있으면 그 값을 우선 사용'],['이달 할부 납부액',won(inst.reduce((s,r)=>s+r.current,0)),'등록한 할부의 현재 회차 원금'],['남은 할부 원금',won(inst.reduce((s,r)=>s+r.remaining,0)),'선택 월을 포함한 미도래 회차 합계']])}<div class="v2-grid double">${bills.map(({c,b})=>`<section class="card"><div class="card-top"><h2 class="card-title">${esc(c.name)} <span class="pill-subtle">${esc(c.person)}</span></h2><button class="text-link" data-action="card-edit" data-id="${esc(c.id)}">청구액·주기 수정</button></div><div class="metric-value">${won(b.amount)}</div><p class="metric-sub">${dayInMonth(month,c.day)} 출금 · ${b.manual?'직접 입력한 확정·예정액':'내역으로 계산한 예상액'}</p><div class="line-pair"><span>등록 내역 합계</span><strong>${won(b.estimated)}</strong></div>${b.manual?`<div class="line-pair"><span>입력 청구액과 차이</span><strong>${signed(b.amount-b.estimated)}</strong></div>`:''}${tableV2(['청구 항목','회차','이번 청구'],b.rows.slice(0,6).map(r=>[esc(r.transaction.merchant),`${r.index}/${r.count}`,won(r.amount)]),'이 달에 해당하는 사용 내역이 없어요.')}<div class="form-actions">${v2button('청구 내역 전체 보기','bill-detail',c.id)}</div></section>`).join('')}</div><h2 class="section-heading">차근차근 갚아가는 할부</h2><section class="card table-card">${tableV2(['구매 내역','카드','총 구매액','첫 청구 / 마지막','남은 회차','남은 원금',''],inst.map(r=>[esc(r.t.merchant),esc(r.card.name),won(r.t.amount),`${esc(r.first)} ~ ${esc(r.last)}`,`${r.count-r.paid}/${r.count}`,won(r.remaining),`<button class="row-action" data-action="tx-edit" data-id="${esc(r.t.id)}">수정</button>`]))}</section>${statNote('할부 이자·리볼빙·해외 결제 확정 환율은 자동 계산하지 않아요. 확정 청구액으로 보정하세요. 취소·부분 취소는 원래 할부 내역과 잔여 회차도 함께 확인해 주세요.')}`;}
function householdPage(){const s=settlementFor(month),fixed=fixedFor(month),pending=fixed.filter(f=>!f.transaction);return`${pageHead('부부 정산과 고정비','누가 결제했는지, 함께 얼마씩 부담할지 또렷하게.','고정비 추가','fixed-new')}${summary([['이번 달 공동 지출',won(s.total),'사용자 구분이 공동인 지출 합계'],[s.balance>=0?'배우자가 나에게 보낼 돈':'내가 배우자에게 보낼 돈',won(Math.abs(s.balance)),'기록한 부담 비율과 완료된 정산 반영'],['아직 확인할 고정비',won(pending.reduce((a,f)=>a+f.amount,0)),`${pending.length}건 · 납부 확인 후 실제 지출로 반영`]])}<section class="card"><div class="card-top"><h2 class="card-title">함께 쓴 돈, 공평하게 나누기</h2>${v2button('정산 완료 기록','settle-new')}</div><p class="modal-note">공동 지출의 결제자와 ‘내 부담 비율’을 기록하면 차액을 계산해요. 공동 통장으로 결제한 건은 개인 간 정산에서 제외합니다.</p>${tableV2(['사용 내역','결제자','내 부담','배우자 부담','정산 영향',''],s.rows.map(t=>[esc(t.merchant),esc(t.payer),`${won(t.my)} (${t.myShare}%)`,won(t.spouse),t.balance===0?'공동 자금':`${t.balance>0?'받을 돈':'보낼 돈'} ${won(Math.abs(t.balance))}`,`<button class="row-action" data-action="tx-edit" data-id="${esc(t.id)}">수정</button>`]))}${s.records.length?`<h3 class="section-heading">완료된 정산</h3>${tableV2(['날짜','보낸 사람','금액',''],s.records.map(r=>[esc(r.date),esc(r.from),won(r.amount),v2button('삭제','remove-confirm','settlements:'+r.id)]))}`:''}</section><div class="section-toolbar" style="margin-top:26px"><h2 class="section-heading" style="margin:0">매달 반복되는 고정비</h2>${v2button('고정비 추가','fixed-new')}</div><div class="v2-grid double">${fixed.map(f=>`<section class="card"><div class="card-top"><h3 class="card-title">${esc(f.name)}</h3><span class="pill-subtle">${f.transaction?'납부 확인':'확인 필요'}</span></div><div class="metric-value">${won(f.transaction?.amount??f.amount)}</div><p class="metric-sub">매월 ${f.day}일 · ${esc(state.cards.find(c=>c.id===f.card)?.name||'계좌·현금')} · ${esc(f.person)}</p><div class="form-actions">${v2button('수정','fixed-edit',f.id)}${f.transaction?`<button class="button ghost" data-action="tx-edit" data-id="${esc(f.transaction.id)}">지출 기록 확인</button>`:v2button('납부 확인','fixed-pay',f.id,'primary')}</div></section>`).join('')||'<section class="card empty">이 달에 예정된 고정비가 없어요.</section>'}</div>${state.fixedExpenses.some(f=>!f.active)?`<section class="card" style="margin-top:18px"><h3 class="card-title">중지한 고정비</h3>${state.fixedExpenses.filter(f=>!f.active).map(f=>`<div class="line-pair"><span>${esc(f.name)}</span>${v2button('수정·재개','fixed-edit',f.id)}</div>`).join('')}</section>`:''}${statNote('카드로 납부하는 고정비는 지출 확인 후 해당 카드 청구 주기에 반영돼요. 이미 가져온 같은 날짜·가맹점·카드의 내역이 있으면 연결해 중복을 피합니다.')}`;}
function budgetPage(){const r=monthReport(month),prev=monthReport(addMonth(month,-1)),cats=[...new Set([...Object.keys(state.settings.categoryBudgets),...Object.keys(r.categories)])].filter(c=>c!=='대출이자'),total=Object.values(state.settings.categoryBudgets).reduce((s,v)=>s+v,0);return`${pageHead('항목별 예산','어디에 얼마나 썼는지, 남은 여유는 얼마나 되는지.','예산 수정','budget-edit')}${summary([['전체 생활비 예산',won(state.settings.budget),'전체 한도는 가계부 설정에서 수정'],['항목별 배분 합계',won(total),`전체 예산 중 미배분 ${won(state.settings.budget-total)}`],['이번 달 생활비',won(r.living),`지난달보다 ${signed(r.living-prev.living)}`]])}<div class="v2-grid double">${cats.map(cat=>{const spent=r.categories[cat]||0,budget=state.settings.categoryBudgets[cat]||0,pct=budget?spent/budget*100:0;return`<section class="card"><div class="card-top"><h3 class="card-title">${esc(cat)}</h3><span class="pill-subtle">${budget?`${Math.round(pct)}% 사용`:'예산 미설정'}</span></div><div class="budget-head"><strong class="metric-value">${won(spent)}</strong><span class="metric-sub">예산 ${won(budget)}</span></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,pct))}%;${spent>budget&&budget?'background:#c7827c':''}"></i></div><div class="line-pair"><span>${budget?'남은 예산':'지난달 사용액'}</span><strong class="${budget&&spent>budget?'negative':''}">${won(budget?budget-spent:prev.categories[cat]||0)}</strong></div></section>`;}).join('')}</div>${statNote('구매일 기준 지출을 사용해요. 할부도 구매한 달에 전체 구매액을 소비로 기록하며 실제 카드 납부액은 청구·할부 화면에서 확인합니다. 대출이자는 생활비 예산과 구분합니다.')}`;}
function reportsPage(){const r=monthReport(month),p=monthReport(addMonth(month,-1)),a=netAttribution(month),closed=state.history.find(h=>h.month===month&&h.savedAt);const cats=Object.entries(r.categories).sort((a,b)=>b[1]-a[1]);return`${pageHead('한 달을 돌아보는 우리 집 결산','얼마를 쓰고 모았는지, 자산은 어떻게 달라졌는지.','이번 달 마감 저장','close-month')}${summary([['수입과 지출',`${man(r.income)} / ${man(r.expense)} 원`,`지난달 지출 대비 ${signed(r.expense-p.expense)}`],['실제 저축·투자 납입',won(r.savings),`납입 기록 기준 저축률 ${r.savingsRate.toFixed(1)}%`],['기록한 대출이자',won(r.interest),'예상 이자가 아닌 가계부의 실제 지출']])}<div class="v2-grid double"><section class="card">${cardTop('이번 달 소비 요약','','')}${tableV2(['분류','이번 달','지난달 대비'],cats.map(([cat,v])=>[esc(cat),won(v),signed(v-(p.categories[cat]||0))]))}<p class="context-note">총 ${r.txCount}건 · 이 달 카드 청구 예정 ${won(r.bills)}</p></section><section class="card">${cardTop('순자산 변화의 이유','','')}${a?`<div class="metric-value">${signed(a.change)}</div>${tableV2(['변화 항목','순자산에 미친 영향'],[['부동산 평가액 변경',signed(a.valuation)],['투자 손익 변화',signed(a.invest)],['부채 감소',signed(a.debt)],['저축·입출금 등 기타 변화',signed(a.other)]])}<p class="context-note">기타 변화는 총 변화에서 앞의 세 항목을 뺀 값이에요. 순수 저축액과 같지 않을 수 있어요. 투자 손익은 실현·미실현 손익의 변화이며 배당 현금은 기타 변화에 포함될 수 있어요.</p>`:'<div class="empty">상세 분석은 두 달의 마감 기록이 필요해요.<br>이번 달 마감을 저장해 다음 달부터 비교해 보세요.</div>'}<p class="context-note">${closed?`마지막 마감: ${esc(closed.savedAt.slice(0,10))} · 저장 순자산 ${won(closed.net)}`:'선택 월의 마감 기록이 아직 없어요.'}</p></section></div><section class="card" style="margin-top:18px"><div class="card-top"><h2 class="card-title">이번 달 투자와 납입</h2>${v2button('계좌 입출금 기록','flow-new')}</div><div class="v2-metrics"><div><small>실현 매매손익</small><strong>${signed(r.realized)}</strong></div><div><small>세후 배당금</small><strong>${won(r.dividends)}</strong></div><div><small>기록한 계좌 순입금</small><strong>${won(fundTotals(month).net)}</strong></div></div><p class="context-note">소비·저축은 구매·납입 기준이고 청구액은 출금 기준이므로 단순히 합산하지 않아요. 마감 저장은 선택 월의 보고서와 현재 자산 입력값을 함께 기록합니다.</p></section>`;}
function goalsPage(){return`${pageHead('목적별 돈 모으기','여행부터 비상금까지, 이름을 붙이면 더 가까워져요.','목표 추가','goal-new')}<div class="info-note">${icon('info')}목표 금액은 이미 가진 돈의 용도를 나누는 기록이에요. 총자산이나 실제 저축액에 다시 더하지 않습니다.</div><div class="v2-grid double">${state.goals.map(g=>{const done=g.records.reduce((s,r)=>s+r.amount,0),left=g.target-done,pct=done/g.target*100;return`<section class="card goal-card"><div class="card-top"><h2 class="card-title">${esc(g.name)}</h2>${v2button('목표 수정','goal-edit',g.id)}</div><p class="metric-sub">${esc(g.memo)} · ${esc(g.deadline)}까지</p><div class="metric-value">${won(done)}</div><div class="progress"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div><div class="line-pair"><span>목표 ${won(g.target)}</span><strong>${pct.toFixed(0)}%</strong></div><div class="line-pair"><span>${left>0?'목표까지 남은 금액':'목표를 달성했어요'}</span><strong>${won(Math.max(0,left))}</strong></div><div class="form-actions">${v2button('모은 돈 기록','goal-record',g.id,'primary')}</div>${g.records.length?tableV2(['날짜','배정 금액',''],g.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(r=>[esc(r.date),signed(r.amount),v2button('삭제','remove-confirm','goalRecord:'+g.id+':'+r.id)])):''}</section>`;}).join('')||'<section class="card empty">첫 번째 목표를 정해 볼까요?</section>'}</div>`;}
investments=function(){const pf=portfolio(),stocks=pf.stocks.filter(matches),history=stocks.flatMap(s=>s.history.map(t=>({...t,stockName:s.name,account:s.account}))).filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)),flow=fundTotals(month),tabs=['보유 종목','매수·매도·배당','계좌별 납입'];let body='';if(investmentTab==='보유 종목')body=tableV2(['종목 / 계좌','보유 수량','평균 매입가','입력한 가격','평가금액','평가손익',''],stocks.map(s=>[`${esc(s.name)}<small class="stock-code">${esc(s.account)}</small>`,`${s.qty.toLocaleString('ko-KR',{maximumFractionDigits:6})}주`,won(s.cost),`${won(s.price)}<small class="stock-code">${esc(s.date)}</small>`,won(s.value),`<span class="${s.unrealized>=0?'positive':'negative'}">${signed(s.unrealized)}</span>`,`<button class="row-action" data-action="stock-edit" data-id="${esc(s.id)}">수정</button>`]));else if(investmentTab==='매수·매도·배당')body=tableV2(['날짜','종목','종류','수량 / 배당액','가격','비용','실현손익 / 세후 배당',''],history.map(t=>[esc(t.date),esc(t.stockName),esc(t.type),t.type==='배당'?won(t.amount):`${t.qty}주`,t.type==='배당'?'—':won(t.price),won((t.fee||0)+(t.tax||0)),t.type==='매수'?'매입원가에 반영':signed(t.profit),v2button('수정','trade-edit',t.id)]));else{const accounts=[...new Set(flow.year.map(f=>f.account))];body=tableV2(['계좌','유형','올해 입금 합계','올해 출금 합계','올해 순입금'],accounts.map(name=>{const rs=flow.year.filter(f=>f.account===name);return[esc(name),esc(rs[0].accountType),won(rs.filter(r=>r.direction==='입금').reduce((s,r)=>s+r.amount,0)),won(rs.filter(r=>r.direction==='출금').reduce((s,r)=>s+r.amount,0)),signed(rs.reduce((s,r)=>s+(r.direction==='입금'?r.amount:-r.amount),0))];}))+`<h3 class="section-heading">선택 월 입출금</h3>`+tableV2(['날짜','계좌','입출금','금액','저축 집계',''],flow.rows.map(f=>[esc(f.date),esc(f.account),esc(f.direction),won(f.amount),f.includeSavings?'포함':'제외',v2button('수정','flow-edit',f.id)]));}
 const old=v1.investments(),start=old.indexOf('<div class="section-toolbar" style="margin-top:28px');return`${pageHead('투자와 주식 모으기','보유 종목, 실제 매매와 배당, 계좌 납입까지 함께.','보유 종목 추가','stock-new')}${demoBanner()}${summary([['보유 평가금액',won(stocks.reduce((s,x)=>s+x.value,0)),'직접 입력한 종목 가격 기준'],['누적 실현 매매손익',signed(stocks.reduce((s,x)=>s+x.realized,0)),'이동평균 원가 · 수수료와 세금 반영'],['누적 세후 배당금',won(stocks.reduce((s,x)=>s+x.dividends,0)),'배당액에서 기록한 세금·수수료 차감']])}<div class="info-note">${icon('info')}매수·매도 기록은 보유 수량과 평균 매입가를 자동 갱신해요. 주식 가격은 직접 입력하며 모든 기록은 원화 기준입니다. 거래·배당의 현금은 통장 잔액에 자동 가감하지 않아요.</div><div class="section-toolbar"><div class="filter-tabs">${tabs.map(t=>`<button class="${investmentTab===t?'selected':''}" data-action="v2-invest-tab" data-value="${t}">${t}</button>`).join('')}</div><div class="v2-inline">${v2button('매매·배당 기록','trade-new')}${v2button('계좌 입출금','flow-new')}</div></div><section class="card table-card">${body}</section>${start>=0?old.slice(start):''}${statNote('계좌별 납입 누계는 직접 기록한 입출금 합계이며 세법상 납입 한도·공제액을 자동 판정하지 않아요. 계좌 간 이동은 저축 집계에서 제외해 중복을 피하세요.')}`;};
function moreFields(formName,html){document.querySelector(`form[data-form="${formName}"] .form-grid`).insertAdjacentHTML('beforeend',html);}

cardForm=function(id){const c=state.cards.find(c=>c.id===id)||{name:'',person:'나',day:25,cycleEnd:31,paymentLag:1,billOverrides:{}};const override=c.billOverrides?.[month];openModal(id?'카드와 청구 주기 수정':'새 카드 등록',`<p class="modal-note">카드사별 이용 기간이 다르므로 청구서 기준으로 주기를 설정해 주세요. 첫 청구월을 사용 내역에서 직접 지정할 수도 있어요.</p><form data-form="card" data-id="${id||''}"><div class="form-grid">${field('카드 별칭','name',c.name,'text','required maxlength="40"',true)}${selectField('사용자','person',['나','배우자','공동'],c.person)}${field('매월 결제일','day',c.day,'number','min="1" max="31" required')}${field('이용 기간 마감일 (말일은 31)','cycleEnd',c.cycleEnd,'number','min="1" max="31" required')}${selectField('마감 월에서 몇 개월 뒤 결제','paymentLag',['0','1','2'],String(c.paymentLag))}${field('청구액을 입력할 월','overrideMonth',month,'month','required')}${field('해당 월 확정·예정액 (자동 계산은 비우기)','overrideAmount',override??'','number','min="0" step="1"')}<p class="field-help full">직접 입력한 청구액은 해당 월에만 적용돼요. 비우고 저장하면 그 월을 자동 계산으로 되돌립니다. 카드번호와 금융기관 비밀번호는 입력하지 않아요.</p></div>${actions('cards',id)}</form>`);};

function fixedForm(id){const f=state.fixedExpenses.find(f=>f.id===id)||{name:'',amount:'',category:'주거·통신',day:25,card:'',person:'공동',payer:'공동',start:month,end:'',active:true};openModal('매월 반복되는 고정비',`<form data-form="v2-fixed" data-id="${id||''}"><div class="form-grid">${field('고정비 이름','name',f.name,'text','required maxlength="60"',true)}${field('예상 금액 (원)','amount',f.amount,'number','min="0" required')}${field('매월 예정일','day',f.day,'number','min="1" max="31" required')}${selectField('분류','category',CAT,f.category)}${selectField('지출 구분','person',['나','배우자','공동'],f.person)}${selectField('결제자','payer',['나','배우자','공동'],f.payer)}<label class="field">결제 카드<span class="select-wrap"><select name="card"><option value="">계좌·현금</option>${state.cards.map(c=>`<option value="${esc(c.id)}" ${c.id===f.card?'selected':''}>${esc(c.name)}</option>`).join('')}</select></span></label>${field('시작 월','start',f.start,'month','required')}${field('종료 월 (선택)','end',f.end,'month')}${selectField('반복 상태','active',['사용','중지'],f.active?'사용':'중지',true)}</div>${extendedActions('fixedExpenses',id)}</form>`);}
function fixedPayForm(id){const f=state.fixedExpenses.find(f=>f.id===id);openModal('고정비 납부 확인',`<p class="modal-note">실제로 납부한 금액으로 지출 기록을 만듭니다. 이미 가져온 같은 내역이 있으면 연결해요.</p><form data-form="v2-fixed-pay" data-id="${id}"><div class="form-grid">${field('실제 납부일','date',dayInMonth(month,f.day),'date','required')}${field('실제 납부액 (원)','amount',f.amount,'number','min="0" required')}</div>${extendedActions('',null)}</form>`);}
function settleForm(){const s=settlementFor(month);openModal('부부 정산 완료 기록',`<p class="modal-note">실제 송금을 마친 뒤 기록해 주세요. 지출에 다시 더하지 않고 해당 월의 정산 잔액을 줄입니다.</p><form data-form="v2-settle"><div class="form-grid">${field('송금일','date',month===currM()?today():month+'-01','date','required')}${selectField('보낸 사람','from',['나','배우자'],s.balance<0?'나':'배우자')}${field('실제로 보낸 금액 (원)','amount',Math.abs(s.balance)||'','number','required min="1"',true)}</div>${extendedActions('',null)}</form>`);}

function persistCloudMeta(){localStorage.setItem(CLOUD_KEY,JSON.stringify({url:cloudConfig.url||'',key:cloudConfig.key||'',household:cloud.household,revision:cloud.revision,dirty:cloud.dirty}));}
function updateSyncLabel(){const label=document.querySelector('.local-indicator');if(label){label.textContent=cloud.conflict?'변경 내용 확인 필요':cloud.error?'동기화 확인 필요':cloud.dirty?'기기에 저장 · 전송 대기':cloud.status;label.dataset.sync=cloud.conflict||cloud.error?'warning':cloud.household?'connected':'local';}}
function cloudPage(){const config=!!cloudConfig.url,logged=!!cloud.user;if(cloud.pendingHousehold&&!cloud.household)return `${pageHead('기존 공유 가계부 연결','로그인한 계정의 기록을 찾았어요.')}<section class="card"><h2 class="card-title">기존 공유 기록을 불러올 준비가 됐어요.</h2><p class="modal-note" style="margin-top:15px">현재 기기의 기록을 바꾸기 전에 필요한 기록을 백업해 주세요. 로그인만으로 기존 기기 기록을 덮어쓰지 않습니다.</p><div class="settings-buttons"><button class="button secondary" data-action="export">현재 기기 기록 백업</button>${v2button('기존 공유 기록 불러오기','cloud-existing-ask','','primary')}${v2button('로그아웃','cloud-signout')}</div></section>`;return`${pageHead('두 사람, 하나의 가계부','각자의 기기에서도 같은 기록을 보고 함께 관리해요.')}<div class="v2-grid double"><section class="card"><h2 class="card-title">${cloud.household?'우리 부부 가계부에 연결됨':'부부 동기화 연결'}</h2><p class="modal-note" style="margin-top:15px">혼자 쓰는 기능은 설정 없이 사용할 수 있어요. 실시간 공유에는 Supabase 프로젝트와 로그인 계정이 필요합니다. ZIP의 <strong>동기화_설정안내.md</strong>와 SQL 파일로 처음 한 번 설정해 주세요.</p><div class="sync-status ${cloud.error||cloud.conflict?'warn':''}">${esc(cloud.conflict?'양쪽에서 변경한 내용이 있어요. 어느 기록을 유지할지 확인해 주세요.':cloud.error||cloud.status)}</div>${cloud.household?`<p class="field-help">현재 로그인: ${esc(cloud.user?.email||'로그인 확인 중')}<br>마지막 서버 버전 ${cloud.revision} · ${cloud.dirty?'이 기기 변경사항 전송 대기':'이 기기 변경사항 전송 완료'}</p><div class="settings-buttons" style="margin-top:18px">${v2button('배우자 초대 코드 만들기','cloud-invite')}${v2button('다시 동기화','cloud-retry')}${v2button('로그아웃','cloud-signout')}</div>${cloud.invite?`<div class="invite-code"><label class="field">배우자에게만 전달할 초대 코드<textarea readonly aria-label="배우자 초대 코드">${esc(cloud.invite)}</textarea></label><p class="field-help">24시간 유효·1회 사용. 새 코드를 만들면 이전 미사용 코드는 취소돼요. 배우자에게 같은 프로젝트 URL·공개 키와 함께 전달하세요.</p></div>`:''}${cloud.conflict?`<div class="settings-block"><h3>기록 충돌 해결</h3><p class="modal-note">먼저 전체 백업을 저장한 뒤 선택해 주세요. 임의로 덮어쓰지 않습니다.</p><div class="settings-buttons"><button class="button secondary" data-action="export">현재 기기 기록 백업</button>${v2button('서버 기록으로 불러오기','cloud-pull-ask')}${v2button('이 기기 기록으로 서버 교체','cloud-push-ask','','danger')}</div></div>`:''}`:`<form data-form="v2-cloud-config"><div class="form-grid">${field('Supabase 프로젝트 URL','url',cloudConfig.url||'','url','required placeholder="https://프로젝트.supabase.co"',true)}${field('공개 publishable / anon 키','key',cloudConfig.key||'','text','required autocomplete="off"',true)}<p class="field-help full">서버 비밀키·service_role 키는 넣지 마세요. 공개 키여도 SQL의 접근 제한과 사용자 로그인이 실제 기록을 보호합니다.</p></div><div class="form-actions"><button class="button secondary" type="submit">연결 설정 저장</button></div></form>${config&&!logged?`<div class="settings-block"><h3>이메일로 로그인</h3><label class="field">이메일<input id="cloud-email" type="email" autocomplete="email" placeholder="사용할 이메일 주소"></label><label class="field" style="margin-top:12px">비밀번호<input id="cloud-password" type="password" autocomplete="current-password" placeholder="10자 이상 권장"></label><div class="form-actions">${v2button('회원가입','cloud-signup')}${v2button('로그인','cloud-login','','primary')}</div><p class="field-help">회원가입 후 받은 이메일에서 인증한 뒤 로그인해 주세요. 비밀번호는 앱 기록·백업에 저장하지 않아요.</p></div>`:''}${logged?`<div class="settings-block"><p class="modal-note">${esc(cloud.user.email)}로 로그인했어요. 현재 기록으로 새 가계부를 만들거나 배우자의 초대 코드로 들어가세요.</p>${v2button('현재 기록으로 공유 가계부 만들기','cloud-create-ask','','primary')}<label class="field" style="margin-top:20px">배우자의 초대 코드<input id="cloud-invite-input" type="text" autocomplete="off" maxlength="64"></label><div class="form-actions">${v2button('초대 코드로 참여','cloud-join-ask')}${v2button('로그아웃','cloud-signout')}</div></div>`:''}`}</section><section class="card"><h2 class="card-title">함께 쓰는 방법</h2><div class="setup-steps"><div><strong>처음 한 번 연결 설정</strong><p>한 사람이 프로젝트를 만들고 제공한 SQL을 실행합니다. 사이트에는 공개 URL과 키만 사용해요.</p></div><div><strong>각자 계정으로 로그인</strong><p>한 사람이 공유 가계부를 만들고, 다른 사람은 일회용 초대 코드로 참여해요.</p></div><div><strong>변경 내용 자동 반영</strong><p>입력한 기록을 자동 전송하고 상대방 변경을 실시간으로 받습니다. 연결이 끊기면 재연결 후 다시 확인해요.</p></div><div><strong>동시에 수정했을 때 확인</strong><p>같은 기록을 동시에 바꾸면 자동으로 덮어쓰지 않아요. 백업 후 어느 기록을 유지할지 선택합니다.</p></div></div><p class="context-note">공유한 가계부에는 부부 두 사람 모두 전체 기록을 볼 수 있어요. 개인 지출 숨기기는 제공하지 않습니다. 설정 전에는 기기별 저장으로 작동합니다.</p></section></div>`;}
function readPublicConfig(url,key){const u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co')||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error('https://프로젝트.supabase.co 형식의 URL을 입력해 주세요.');if(/^sb_secret_/.test(key))throw Error('비밀키를 사용할 수 없어요. 공개 publishable / anon 키를 입력하세요.');if(key.startsWith('eyJ')){try{const body=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(body.role!=='anon')throw Error('공개 anon 키만 사용할 수 있어요.');}catch{throw Error('공개 anon 키인지 확인해 주세요.');}}else if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key))throw Error('공개 publishable / anon 키를 확인해 주세요.');return{url:u.origin,key};}
async function cloudClient(){if(cloud.client)return cloud.client;readPublicConfig(cloudConfig.url,cloudConfig.key);const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloud.client=createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:KEY+':supabase-auth'}});return cloud.client;}
async function initCloud(){if(!cloudConfig.url)return;try{const sb=await cloudClient(),{data,error}=await sb.auth.getSession();if(error)throw error;cloud.user=data.session?.user||null;if(!cloud.user){cloud.status='로그인 후 동기화';updateSyncLabel();return;}const{data:members,error:memberError}=await sb.from('moa_members').select('household_id').eq('user_id',cloud.user.id);if(memberError)throw memberError;if(members?.length){const h=members[0].household_id;if(cloud.household!==h){cloud.pendingHousehold=h;cloud.household='';cloud.status='기존 공유 기록 불러오기 확인 필요';persistCloudMeta();if(page==='cloud')render();else updateSyncLabel();return;}persistCloudMeta();await pullCloud();await subscribeCloud();}else{cloud.household='';cloud.status='공유 가계부 연결 대기';persistCloudMeta();}if(page==='cloud')render();else updateSyncLabel();}catch(e){cloud.error='연결 설정·SQL 실행·로그인 상태를 확인해 주세요.';updateSyncLabel();if(page==='cloud')render();}}
async function cloudAuth(signup){const email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;if(!email||password.length<8)throw Error('이메일과 8자 이상의 비밀번호를 입력해 주세요.');const sb=await cloudClient();const{data,error}=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}}):await sb.auth.signInWithPassword({email,password});document.getElementById('cloud-password').value='';if(error)throw Error(signup?'가입할 수 없어요. 이메일·비밀번호 정책과 기존 가입 여부를 확인해 주세요.':'로그인하지 못했어요. 이메일 인증과 비밀번호를 확인해 주세요.');if(signup&&!data.session){toast('이메일에서 가입 인증 후 로그인해 주세요.');return;}cloud.user=data.user;await initCloud();render();}
async function cloudCreate(){const sb=await cloudClient();if(!cloud.user)throw Error('먼저 로그인해 주세요.');const{data,error}=await sb.rpc('moa_create_household',{initial_state:JSON.parse(JSON.stringify(state))});if(error)throw Error('공유 가계부를 만들지 못했어요. SQL 설정과 기존 가입 가계부를 확인해 주세요.');cloud.household=data;cloud.revision=1;cloud.dirty=false;cloud.status='공유 가계부 연결됨';cloud.error='';persistCloudMeta();await subscribeCloud();render();toast('공유 가계부를 만들었어요. 초대 코드를 생성해 배우자에게 전달하세요.');}
async function cloudJoin(){const sb=await cloudClient();const{data,error}=await sb.rpc('moa_join_household',{invitation:cloud.pendingInvite});cloud.pendingInvite='';if(error)throw Error('참여하지 못했어요. 초대 코드 만료·사용 여부와 기존 가입 가계부를 확인해 주세요.');cloud.household=data;cloud.revision=0;cloud.dirty=false;cloud.conflict=false;persistCloudMeta();await pullCloud(true);await subscribeCloud();render();toast('같은 가계부에 연결했어요.');}
async function cloudInvite(){const sb=await cloudClient();const{data,error}=await sb.rpc('moa_create_invite',{target_household:cloud.household});if(error)throw Error('초대 코드는 가계부를 만든 사람만 만들 수 있고, 최대 두 명까지 참여할 수 있어요.');cloud.invite=data;render();}
async function subscribeCloud(){if(cloud.channel)await cloud.client.removeChannel(cloud.channel);cloud.channel=cloud.client.channel('moa-'+cloud.household).on('postgres_changes',{event:'UPDATE',schema:'public',table:'moa_documents',filter:'household_id=eq.'+cloud.household},()=>{if(cloud.busy){cloud.incoming=true;return;}pullCloud();}).subscribe(status=>{cloud.status=status==='SUBSCRIBED'?'실시간 동기화 연결됨':'자동 동기화 연결 확인 중';updateSyncLabel();});if(cloud.poll)clearInterval(cloud.poll);cloud.poll=setInterval(()=>{if(!document.hidden&&!cloud.busy)pullCloud();},15000);}
function queueCloudSave(){if(!cloud.household||!cloud.user)return;cloud.dirty=true;cloud.version++;persistCloudMeta();clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>pushCloud(),600);updateSyncLabel();}
async function pullCloud(force=false){if(!cloud.household||!cloud.user||cloud.busy)return;try{const sb=await cloudClient(),{data,error}=await sb.from('moa_documents').select('state,revision').eq('household_id',cloud.household).single();if(error)throw error;if(Number(data.revision)<=cloud.revision&&!force){cloud.incoming=false;if(cloud.dirty&&!cloud.conflict)pushCloud();return;}if(cloud.dirty&&!force){cloud.conflict=true;cloud.status='양쪽 변경 확인 필요';updateSyncLabel();if(page==='cloud')render();return;}if(modal.open&&!force){cloud.incoming=true;return;}if(!validBackup(data.state))throw Error('서버 기록 형식이 올바르지 않아요.');state=migrateData(data.state);cloud.revision=Number(data.revision);cloud.dirty=false;cloud.conflict=false;cloud.incoming=false;cloud.error='';persistOnly();persistCloudMeta();render();}catch{cloud.error='동기화 연결을 확인해 주세요. 변경 기록은 이 기기에 보관 중이에요.';updateSyncLabel();}}
async function pushCloud(){if(!cloud.household||!cloud.user||!cloud.dirty||cloud.busy||cloud.conflict)return;cloud.busy=true;const version=cloud.version,payload=JSON.parse(JSON.stringify(state));try{const sb=await cloudClient(),{data,error}=await sb.rpc('moa_save_document',{target_household:cloud.household,expected_revision:cloud.revision,new_state:payload});if(error)throw error;if(!data?.ok){cloud.conflict=true;cloud.status='양쪽 변경 확인 필요';return;}cloud.revision=Number(data.revision);cloud.dirty=version!==cloud.version;cloud.error='';persistCloudMeta();}catch{cloud.error='서버에 전송하지 못했어요. 이 기기의 기록은 유지합니다.';}finally{cloud.busy=false;updateSyncLabel();if(page==='cloud')render();if(cloud.dirty&&!cloud.conflict&&!cloud.error){clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>pushCloud(),600);}else if(cloud.incoming&&!cloud.dirty&&!cloud.conflict)pullCloud();}}
async function overwriteCloud(){const{data,error}=await cloud.client.from('moa_documents').select('revision').eq('household_id',cloud.household).single();if(error)throw Error('서버 버전을 확인하지 못했어요.');cloud.revision=Number(data.revision);cloud.conflict=false;cloud.dirty=true;persistCloudMeta();await pushCloud();}
async function cloudDisconnect(signout){clearTimeout(cloud.timer);if(cloud.poll)clearInterval(cloud.poll);if(cloud.channel&&cloud.client)await cloud.client.removeChannel(cloud.channel);if(signout&&cloud.client)await cloud.client.auth.signOut();cloud.household='';cloud.pendingHousehold='';cloud.user=null;cloud.dirty=false;cloud.conflict=false;cloud.incoming=false;cloud.error='';cloud.revision=0;cloud.status='이 브라우저에 저장';persistCloudMeta();render();toast('로그아웃했어요. 현재 기록은 이 기기에 남아 있어요.');}
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form="v2-cloud-config"]');if(!f)return;e.preventDefault();e.stopImmediatePropagation();try{if(cloud.client)await cloudDisconnect(true);const d=Object.fromEntries(new FormData(f));cloudConfig=readPublicConfig(d.url.trim(),d.key.trim());cloud.client=null;persistCloudMeta();await initCloud();render();toast('공개 연결 설정을 저장했어요. 로그인해 주세요.');}catch(err){toast(err.message||'설정을 확인해 주세요.');}},true);

installNavigation();
if(newTitles[location.hash.slice(1)])page=location.hash.slice(1);
persistOnly();
render();
initCloud();
window.addEventListener('online',()=>{if(cloud.household){cloud.error='';pullCloud();}});

</script>
</body></html>
